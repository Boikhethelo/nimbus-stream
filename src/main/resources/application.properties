spring.datasource.url=jdbc:sqlite:stream_cache.db
spring.datasource.driver-class-name=org.xerial.SQLiteJDBCDriver
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Automatically updates the database schema matching your Java entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---------------------------------------------------------------------------
# Storage backend selection
# ---------------------------------------------------------------------------
# Switches which StorageService implementation Spring activates via
# @ConditionalOnProperty. Valid values: "s3" (default/deployed) or "google-drive".
storage.provider=s3

# ---------------------------------------------------------------------------
# AWS S3 (only read when storage.provider=s3)
# ---------------------------------------------------------------------------
# Region the S3Client/S3Presigner beans in AwsConfig are built against.
# Override at runtime with an environment variable so nothing region-specific
# is hardcoded: AWS_REGION=af-south-1
aws.region=${AWS_REGION:af-south-1}

# Bucket S3StorageService reads/lists from. No default on purpose - the app
# should fail fast at startup rather than silently pointing at the wrong bucket.
# Set via environment variable: AWS_S3_BUCKET=your-bucket-name
aws.s3.bucket=${AWS_S3_BUCKET}

# ---------------------------------------------------------------------------
# Google Drive (only read when storage.provider=google-drive)
# ---------------------------------------------------------------------------
application.name=Nimbus Stream

# No property needed for credentials - GoogleDriveConfig loads the service
# account key from classpath resource /credentials.json. Mount/replace that
# file per-environment; never commit a real one to the repo.